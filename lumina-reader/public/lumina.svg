<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="luminaGradient" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="glowGradient" x1="24" y1="8" x2="24" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded hexagon / shield -->
  <rect x="4" y="4" width="40" height="40" rx="12" fill="url(#luminaGradient)" />

  <!-- Open Book & Radiant Spark Core -->
  <path d="M12 32.5C15.5 30.5 19.5 30.5 24 33.5C28.5 30.5 32.5 30.5 36 32.5V17C32.5 15 28.5 15 24 18C19.5 15 15.5 15 12 17V32.5Z" fill="white" fill-opacity="0.15" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M24 18V33.5" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- Radiant Lumina Star / Sparkle in Center -->
  <path d="M24 9L25.8 13.5L30 15L25.8 16.5L24 21L22.2 16.5L18 15L22.2 13.5L24 9Z" fill="url(#glowGradient)" filter="url(#glow)"/>
</svg>
